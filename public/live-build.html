<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arafat Sulaiman — Live Build</title>
  <style>
    :root {
      --sand: #f0ede4;
      --cyprus: #004741;
      --cyprus-deep: #00352f;
      --ink: #0f1115;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--cyprus);
      color: var(--sand);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    button, a { font: inherit; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #skip {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 40;
      border: 1px solid color-mix(in srgb, var(--sand) 35%, transparent);
      background: color-mix(in srgb, var(--cyprus) 75%, transparent);
      color: var(--sand);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #skip:hover,
    #skip:focus-visible {
      outline: 2px solid var(--sand);
      outline-offset: 3px;
      background: var(--cyprus);
    }

    #skip[hidden] { display: none; }

    .stage {
      display: flex;
      height: 100%;
      min-height: 100svh;
      overflow: hidden;
    }

    .editor,
    .preview {
      position: relative;
      min-width: 0;
      transition: width 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        height 1.05s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.7s ease,
        transform 1.05s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .editor {
      display: flex;
      width: 48%;
      flex-direction: column;
      background: var(--cyprus-deep);
      border-right: 1px solid color-mix(in srgb, var(--sand) 12%, transparent);
    }

    .preview { width: 52%; background: #fff; }

    .chrome {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid color-mix(in srgb, var(--sand) 12%, transparent);
    }

    .dots { display: flex; gap: 0.35rem; }
    .dots span {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: color-mix(in srgb, var(--sand) 28%, transparent);
    }
    .dots span:first-child { background: color-mix(in srgb, var(--sand) 80%, transparent); }
    .dots span:nth-child(2) { background: color-mix(in srgb, var(--sand) 50%, transparent); }

    .tabs { display: flex; gap: 0.25rem; }
    .tab {
      border: 0;
      background: transparent;
      color: color-mix(in srgb, var(--sand) 55%, transparent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7rem;
      padding: 0.3rem 0.55rem;
      border-radius: 0.4rem;
    }
    .tab.is-active {
      background: color-mix(in srgb, var(--sand) 12%, transparent);
      color: var(--sand);
    }

    .code-wrap {
      flex: 1;
      overflow: auto;
      padding: 0.75rem 0 1rem;
    }

    .code {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--sand);
      padding: 0 1rem 0 3.1rem;
    }

    .tok-c { color: color-mix(in srgb, var(--sand) 42%, transparent); }
    .tok-t { color: var(--sand); }
    .tok-a { color: color-mix(in srgb, var(--sand) 72%, #8fbc8f); }
    .tok-s { color: #d9c9a8; }
    .tok-k { color: #b7d3c5; }
    .tok-n { color: #e8dcc6; }

    .caret {
      display: inline-block;
      width: 0.5rem;
      height: 1em;
      margin-left: 1px;
      background: var(--sand);
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.45rem 0.9rem;
      border-top: 1px solid color-mix(in srgb, var(--sand) 12%, transparent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.68rem;
      color: color-mix(in srgb, var(--sand) 60%, transparent);
    }

    .preview iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .zero {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: var(--ink);
      transition: opacity 0.55s ease;
    }

    .zero.is-off {
      opacity: 0;
      pointer-events: none;
    }

    .zero-inner { text-align: center; }
    .zero-count {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--sand) 70%, transparent);
    }
    .zero-caption {
      margin: 1rem 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: color-mix(in srgb, var(--sand) 55%, transparent);
    }
    .zero .caret {
      width: 0.7rem;
      height: 1.2rem;
      margin: 0 auto 1.1rem;
    }

    .stamp {
      position: fixed;
      left: 8vw;
      bottom: 6.8rem;
      z-index: 25;
      transform: translateY(8px);
      opacity: 0;
      pointer-events: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--sand);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .stamp.is-on {
      opacity: 0.8;
      transform: translateY(0);
    }

    .stage.is-reveal .editor {
      width: 0;
      opacity: 0;
      transform: translateX(-2rem);
      pointer-events: none;
      border-right: 0;
    }

    .stage.is-reveal .preview {
      width: 100%;
    }

    @media (max-width: 768px) {
      .stage { flex-direction: column; }
      .editor {
        width: 100%;
        height: 46%;
        border-right: 0;
        border-bottom: 1px solid color-mix(in srgb, var(--sand) 12%, transparent);
      }
      .preview { width: 100%; height: 54%; }
      .code { font-size: 0.64rem; padding-left: 2.4rem; }
      .stage.is-reveal .editor {
        height: 0;
        transform: translateY(-1rem);
      }
      .stage.is-reveal .preview { height: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .caret { animation: none; }
      .editor, .preview, .zero, .stamp { transition: none; }
    }
  </style>
</head>
<body>
  <button id="skip" type="button">Skip intro</button>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div class="zero" id="zero">
    <div class="zero-inner">
      <span class="caret" aria-hidden="true"></span>
      <p class="zero-count">0</p>
      <p class="zero-caption">// initializing workspace</p>
    </div>
  </div>

  <div class="stage" id="stage">
    <section class="editor" aria-label="Code editor">
      <div class="chrome">
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="tabs">
          <span class="tab is-active" data-tab="html">index.html</span>
          <span class="tab" data-tab="css">styles.css</span>
          <span class="tab" data-tab="js">app.js</span>
        </div>
      </div>
      <div class="code-wrap">
        <pre class="code" id="code"></pre>
      </div>
      <div class="status-bar">
        <span id="line-readout">Ln 0</span>
        <span id="file-readout">index.html</span>
      </div>
    </section>

    <section class="preview" aria-label="Live preview">
      <iframe id="frame" title="Live preview of the hero being built"></iframe>
    </section>
  </div>

  <p class="stamp" id="stamp">247 lines. Built from 0.</p>

  <script>
    const CONFIG = {
      charDelayMin: 4,
      charDelayMax: 10,
      lineBreakPause: 70,
      keyLineLinger: 180,
      zeroMs: 1800,
      revealMs: 2200,
      burstMin: 2,
      burstMax: 4,
      finalLineCount: 247,
      mobile: {
        charDelayMin: 2,
        charDelayMax: 6,
        lineBreakPause: 40,
        keyLineLinger: 90,
        zeroMs: 800,
        revealMs: 1200,
        burstMin: 3,
        burstMax: 6,
      },
    };

    const KEY_LINES = [
      "Arafat Sulaiman",
      "background:",
      "letter-spacing:",
      "grid-template-columns",
      "addEventListener",
    ];

    const HTML_SRC = `<header class="hero">
  <img class="hero-photo" src="/images/portrait-cutout.png" alt="Arafat Sulaiman">
  <div class="hero-overlay"></div>
  <div class="hero-copy">
    <p class="status">Available for work</p>
    <h1>Arafat Sulaiman</h1>
    <p class="role">Full-Stack Developer</p>
    <p class="lede">Architecting hardware-integrated systems, interactive e-commerce platforms, and high-performance edge deployments.</p>
    <ul class="tags">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>Next.js</li>
      <li>Cloudflare</li>
      <li>BLE Architecture</li>
    </ul>
    <div class="actions">
      <a class="btn primary" href="#projects">Selected Engineering Work</a>
      <a class="btn ghost" href="#contact">Contact</a>
    </div>
  </div>
</header>`;

    const CSS_SRC = `:root {
  --sand: #F0EDE4;
  --cyprus: #004741;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--cyprus);
  color: var(--sand);
  font-family: system-ui, sans-serif;
}
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 100vh;
  display: grid;
  align-content: center;
}
.hero-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: rgb(0 71 65 / 0.85);
  mix-blend-mode: multiply;
}
.hero-copy {
  position: relative;
  z-index: 10;
  display: grid;
  align-content: center;
  gap: 1.15rem;
  padding: 8vh 8vw;
}
.status {
  margin: 0;
  font-family: ui-monospace, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  opacity: 0.7;
}
h1 {
  margin: 0;
  font-size: clamp(2.6rem, 10vw, 7.4rem);
  line-height: 0.86;
  letter-spacing: -0.07em;
  font-weight: 600;
}
.role {
  margin: 0;
  font-size: clamp(1rem, 2vw, 1.35rem);
  letter-spacing: -0.03em;
}
.lede {
  margin: 0;
  max-width: 38rem;
  line-height: 1.55;
  color: color-mix(in srgb, var(--sand) 78%, transparent);
}
.tags {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(9rem, max-content));
  gap: 0.5rem;
  margin: 0.4rem 0 0;
  padding: 0;
  list-style: none;
}
.tags li {
  border: 1px solid color-mix(in srgb, var(--sand) 28%, transparent);
  border-radius: 999px;
  padding: 0.4rem 0.8rem;
  font-size: 0.75rem;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 0.6rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  padding: 0.85rem 1.15rem;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 600;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.btn.primary {
  background: var(--sand);
  color: var(--cyprus);
}
.btn.ghost {
  border: 1px solid var(--sand);
  color: var(--sand);
}
.btn.is-live { transform: translateY(-3px); }
.status.blink { opacity: 0.32; }`;

    const CSS_MOBILE = `:root { --sand:#F0EDE4; --cyprus:#004741; }
* { box-sizing: border-box; }
body { margin:0; background:var(--cyprus); color:var(--sand); font-family:system-ui,sans-serif; }
.hero { position:relative; isolation:isolate; overflow:hidden; min-height:100vh; display:grid; align-content:center; }
.hero-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.hero-overlay { position:absolute; inset:0; z-index:1; background:rgb(0 71 65 / .85); mix-blend-mode:multiply; }
.hero-copy { position:relative; z-index:10; display:grid; align-content:center; gap:1rem; padding:7vh 6vw; }
.status { font-family:ui-monospace,monospace; letter-spacing:.28em; text-transform:uppercase; font-size:.68rem; opacity:.7; }
h1 { margin:0; font-size:clamp(2.2rem,14vw,4.2rem); line-height:.88; letter-spacing:-.07em; }
.role { margin:0; }
.lede { max-width:36rem; line-height:1.5; }
.tags { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.4rem; list-style:none; padding:0; }
.tags li { border:1px solid color-mix(in srgb,var(--sand) 28%, transparent); border-radius:999px; padding:.35rem .7rem; font-size:.7rem; }
.actions { display:flex; flex-wrap:wrap; gap:.6rem; }
.btn { padding:.8rem 1rem; border-radius:999px; text-decoration:none; font-weight:600; }
.btn.primary { background:var(--sand); color:var(--cyprus); }
.btn.ghost { border:1px solid var(--sand); color:var(--sand); }
.btn.is-live { transform:translateY(-3px); }
.status.blink { opacity:.32; }`;

    const JS_SRC = `const buttons = document.querySelectorAll(".btn");
buttons.forEach((btn) => {
  btn.addEventListener("pointerenter", () => btn.classList.add("is-live"));
  btn.addEventListener("pointerleave", () => btn.classList.remove("is-live"));
  btn.addEventListener("click", (event) => {
    const href = btn.getAttribute("href") || "";
    if (!href.startsWith("#")) return;
    event.preventDefault();
    const root = window.top || window;
    root.location.hash = href.slice(1);
  });
});
const status = document.querySelector(".status");
setInterval(() => status.classList.toggle("blink"), 1000);`;

    const els = {
      skip: document.getElementById("skip"),
      live: document.getElementById("live"),
      zero: document.getElementById("zero"),
      stage: document.getElementById("stage"),
      code: document.getElementById("code"),
      frame: document.getElementById("frame"),
      line: document.getElementById("line-readout"),
      file: document.getElementById("file-readout"),
      stamp: document.getElementById("stamp"),
      tabs: [...document.querySelectorAll(".tab")],
    };

    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cfg = isMobile ? { ...CONFIG, ...CONFIG.mobile } : CONFIG;
    const cssSource = isMobile ? CSS_MOBILE : CSS_SRC;

    let htmlBuf = "";
    let cssBuf = "";
    let jsBuf = "";
    let viewLang = "html";
    let cancelled = false;
    let finished = false;

    function rand(min, max) {
      return Math.round(min + Math.random() * (max - min));
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function highlight(code, lang) {
      let out = escapeHtml(code);
      if (lang === "html") {
        out = out.replace(/(&lt;\/?)([\w-]+)([^&]*?)(&gt;)/g, (_, open, tag, rest, close) => {
          const attrs = rest.replace(
            /([\w:-]+)=(&quot;.*?&quot;|&#39;.*?&#39;)/g,
            '<span class="tok-a">$1</span>=<span class="tok-s">$2</span>',
          );
          return `<span class="tok-t">${open}${tag}</span>${attrs}<span class="tok-t">${close}</span>`;
        });
      } else if (lang === "css") {
        out = out.replace(/\/\*[\s\S]*?\*\//g, '<span class="tok-c">$&</span>');
        out = out.replace(/([a-z-]+)(\s*:)/g, '<span class="tok-a">$1</span>$2');
        out = out.replace(/:[^\n;{]+/g, (m) => m.replace(/#[0-9A-Fa-f]{3,8}|var\([^)]+\)|"[^"]*"|'[^']*'/g, '<span class="tok-s">$&</span>'));
      } else {
        out = out.replace(/(\/\/.*)/g, '<span class="tok-c">$1</span>');
        out = out.replace(/\b(const|let|return|if)\b/g, '<span class="tok-k">$1</span>');
        out = out.replace(/("[^"]*"|'[^']*')/g, '<span class="tok-s">$1</span>');
        out = out.replace(/\b(document|window|querySelectorAll|classList|addEventListener)\b/g, '<span class="tok-n">$1</span>');
      }
      return out;
    }

    function setTab(lang) {
      viewLang = lang;
      els.tabs.forEach((tab) => {
        tab.classList.toggle("is-active", tab.dataset.tab === lang);
      });
      els.file.textContent =
        lang === "html" ? "index.html" : lang === "css" ? "styles.css" : "app.js";
    }

    function currentBuffer() {
      if (viewLang === "css") return cssBuf;
      if (viewLang === "js") return jsBuf;
      return htmlBuf;
    }

    function renderEditor() {
      const source = currentBuffer();
      const lines = source ? source.split("\n").length : 0;
      els.code.innerHTML = highlight(source, viewLang) + '<span class="caret" aria-hidden="true"></span>';
      els.line.textContent = `Ln ${lines}`;
      els.code.closest(".code-wrap").scrollTop = els.code.closest(".code-wrap").scrollHeight;
    }

    function previewDoc(includeJs) {
      const scriptOpen = "<scr" + "ipt>";
      const scriptClose = "</scr" + "ipt>";
      const jsBlock =
        includeJs && jsBuf
          ? scriptOpen + jsBuf.replace(/<\/script>/gi, "<\\/script>") + scriptClose
          : "";
      return (
        "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8' /><style>html,body{height:100%;margin:0;}" +
        cssBuf +
        "</style></head><body>" +
        htmlBuf +
        jsBlock +
        "</body></html>"
      );
    }

    function updatePreview(includeJs) {
      els.frame.srcdoc = previewDoc(!!includeJs);
    }

    function notify(status) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "live-build", status }, "*");
      }
    }

    function isKeyIndex(source, index) {
      const slice = source.slice(Math.max(0, index - 48), index + 1);
      return KEY_LINES.some((key) => slice.endsWith(key) || slice.endsWith(key + ";"));
    }

    async function typeInto(target, source, lang) {
      setTab(lang);
      let i = 0;
      while (i < source.length) {
        if (cancelled) return;
        let take = 1;
        if (source[i] !== "\n" && !isKeyIndex(source, i)) {
          const nl = source.indexOf("\n", i);
          const limit = nl === -1 ? source.length : nl;
          take = Math.min(limit - i, rand(cfg.burstMin || 2, cfg.burstMax || 4));
          take = Math.max(1, take);
        }
        const chunk = source.slice(i, i + take);
        if (lang === "html") htmlBuf += chunk;
        if (lang === "css") cssBuf += chunk;
        if (lang === "js") jsBuf += chunk;
        i += take;
        renderEditor();
        const last = chunk[chunk.length - 1];
        if (last === "\n") {
          if (lang !== "js") updatePreview(false);
          await sleep(cfg.lineBreakPause);
        } else if (isKeyIndex(source, i - 1)) {
          if (lang !== "js") updatePreview(false);
          await sleep(cfg.keyLineLinger);
        } else {
          await sleep(rand(cfg.charDelayMin, cfg.charDelayMax));
        }
      }
      updatePreview(lang === "js");
    }

    function finish() {
      if (finished) return;
      finished = true;
      cancelled = true;
      htmlBuf = HTML_SRC;
      cssBuf = cssSource;
      jsBuf = JS_SRC;
      els.zero.classList.add("is-off");
      setTab("js");
      renderEditor();
      updatePreview(true);
      els.stage.classList.add("is-reveal");
      els.line.textContent = `${CONFIG.finalLineCount} lines`;
      els.stamp.classList.add("is-on");
      els.skip.hidden = true;
      els.live.textContent = "Portfolio loaded";
      notify("complete");
    }

    async function play() {
      if (reduced) {
        finish();
        return;
      }

      notify("start");
      await sleep(cfg.zeroMs);
      if (cancelled) return finish();
      els.zero.classList.add("is-off");

      await typeInto("html", HTML_SRC, "html");
      if (cancelled) return finish();
      await typeInto("css", cssSource, "css");
      if (cancelled) return finish();
      await typeInto("js", JS_SRC, "js");
      if (cancelled) return finish();
      await sleep(280);
      finish();
    }

    els.skip.addEventListener("click", () => {
      cancelled = true;
      finish();
      notify("skip");
    });

    play();
  </script>
</body>
</html>
